<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>MindAR.js 多目标 + 3D 模型</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://unpkg.com/mind-ar/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 3; uiLoading: false; uiScanning: false;" embedded>
    <a-assets>
      <a-asset-item id="targets" src="targets.mind"></a-asset-item>
      <!-- 加载你的 GLB 模型 -->
      <a-asset-item id="model0" src="models/model2.glb"></a-asset-item>
      <a-asset-item id="model1" src="models/model0.glb"></a-asset-item>
      <a-asset-item id="model2" src="models/model1.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0"></a-camera>

    <!-- 基础光照，避免在移动端模型过暗不可见 -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="0 1 1"></a-entity>

    <!-- 目标 0：加载第一个 3D 模型 -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity gltf-model="#model0" scale="0.8 0.8 0.8" position="0 0 0" rotation="90 0 0">
      </a-entity>
      <!-- 目标0 文本描述（位于卡片平面的下方侧边） -->
      <a-plane width="1.2" height="0.36" color="#ffffff" opacity="0.85" position="0.45 -0.48 0.0005"
        rotation="90 0 0"></a-plane>
      <a-text value="测试文案：这款家具强调木质纹理与人体工学曲线，采用模块化连接，方便拆装与维护。适合小户型的灵活布局，兼顾结构强度与视觉轻盈。" color="#222" width="1.18"
        wrap-count="28" anchor="center" baseline="top" position="0.45 -0.48 0.001" rotation="90 0 0"></a-text>
    </a-entity>

    <!-- 目标 1：加载第二个 3D 模型 -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-entity gltf-model="#model1" scale="0.8 0.8 0.8" position="0 0 0" rotation="90 0 0">
      </a-entity>
      <!-- 目标1 文本描述（位于卡片平面的下方侧边） -->
      <a-plane width="1.2" height="0.36" color="#ffffff" opacity="0.85" position="0.45 -0.48 0.0005"
        rotation="90 0 0"></a-plane>
      <a-text value="测试文案：这款家具强调木质纹理与人体工学曲线，采用模块化连接，方便拆装与维护。适合小户型的灵活布局，兼顾结构强度与视觉轻盈。" color="#222" width="1.18"
        wrap-count="28" anchor="center" baseline="top" position="0.45 -0.48 0.001" rotation="90 0 0"></a-text>
    </a-entity>

    <!-- 目标 2：加载第三个 3D 模型 -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-entity gltf-model="#model2" scale="0.8 0.8 0.8" position="0 0 0" rotation="90 0 0">
      </a-entity>
      <!-- 目标2 文本描述（位于卡片平面的下方侧边） -->
      <a-plane width="1.2" height="0.36" color="#ffffff" opacity="0.85" position="0.45 -0.48 0.0005"
        rotation="90 0 0"></a-plane>
      <a-text value="测试文案：这款家具强调木质纹理与人体工学曲线，采用模块化连接，方便拆装与维护。适合小户型的灵活布局，兼顾结构强度与视觉轻盈。" color="#222" width="1.18"
        wrap-count="28" anchor="center" baseline="top" position="0.45 -0.48 0.001" rotation="90 0 0"></a-text>
    </a-entity>
  </a-scene>
</body>

</html>
