<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>MindAR.js 多目标 + 3D 模型</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://unpkg.com/mind-ar/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // 鼠标滚轮缩放组件（桌面端）
    AFRAME.registerComponent('wheel-scale', {
      schema: { min: { type: 'number', default: 0.2 }, max: { type: 'number', default: 2.5 }, step: { type: 'number', default: 0.1 } },
      init: function () {
        this.onWheel = this.onWheel.bind(this);
        window.addEventListener('wheel', this.onWheel, { passive: false });
      },
      remove: function () {
        window.removeEventListener('wheel', this.onWheel);
      },
      onWheel: function (e) {
        // 阻止页面滚动
        e.preventDefault();
        const object3D = this.el.object3D;
        const current = object3D.scale.x; // 等比缩放
        const delta = e.deltaY > 0 ? -this.data.step : this.data.step;
        const next = Math.min(this.data.max, Math.max(this.data.min, current + delta));
        object3D.scale.set(next, next, next);
      }
    });
  </script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 3; uiLoading: false; uiScanning: false;" embedded>
    <a-assets>
      <a-asset-item id="targets" src="targets.mind"></a-asset-item>
      <!-- 加载你的 GLB 模型 -->
      <a-asset-item id="model0" src="models/model2.glb"></a-asset-item>
      <a-asset-item id="model1" src="models/model0.glb"></a-asset-item>
      <a-asset-item id="model2" src="models/model1.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0"></a-camera>

    <!-- 基础光照，避免在移动端模型过暗不可见 -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="0 1 1"></a-entity>

    <!-- 目标 0：加载第一个 3D 模型 -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity gltf-model="#model0" scale="0.8 0.8 0.8" position="0 0 0" rotation="90 0 0" wheel-scale>
      </a-entity>
      <!-- 目标0 文本描述：贴在卡片平面，下方偏右，略微抬高Z避免Z-Fighting -->
      <a-text
        value="Test: Modular furniture with ergonomic curves and natural wood grain. Easy to assemble and maintain. Designed for compact homes, balancing structural strength and visual lightness."
        color="#ffffff" width="1.18" wrap-count="28" anchor="center" baseline="top" side="double"
        position="0.45 -0.48 0.01" rotation="0 0 0"></a-text>
    </a-entity>

    <!-- 目标 1：加载第二个 3D 模型 -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-entity gltf-model="#model1" scale="0.8 0.8 0.8" position="0 0 0" rotation="90 0 0" wheel-scale>
      </a-entity>
      <!-- 目标1 文本描述：贴在卡片平面，下方偏右，略微抬高Z避免Z-Fighting -->
      <a-text
        value="Test: Modular furniture with ergonomic curves and natural wood grain. Easy to assemble and maintain. Designed for compact homes, balancing structural strength and visual lightness."
        color="#ffffff" width="1.18" wrap-count="28" anchor="center" baseline="top" side="double"
        position="0.45 -0.48 0.01" rotation="0 0 0"></a-text>
    </a-entity>

    <!-- 目标 2：加载第三个 3D 模型 -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-entity gltf-model="#model2" scale="0.8 0.8 0.8" position="0 0 0" rotation="90 0 0" wheel-scale>
      </a-entity>
      <!-- 目标2 文本描述：贴在卡片平面，下方偏右，略微抬高Z避免Z-Fighting -->
      <a-text
        value="Test: Modular furniture with ergonomic curves and natural wood grain. Easy to assemble and maintain. Designed for compact homes, balancing structural strength and visual lightness."
        color="#ffffff" width="1.18" wrap-count="28" anchor="center" baseline="top" side="double"
        position="0.45 -0.48 0.01" rotation="0 0 0"></a-text>
    </a-entity>
  </a-scene>
</body>

</html>
