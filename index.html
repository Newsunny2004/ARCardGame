<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MindAR.js Multi-target + 3D Models</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://unpkg.com/mind-ar/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Image loading debug
    window.addEventListener('load', function () {
      const images = [
        'chair', 'light', 'sofa',
        'designer1', 'designer2', 'designer3', 'designer4',
        'designer5', 'designer6', 'designer7', 'designer8'
      ];
      images.forEach(id => {
        const img = document.getElementById(id);
        if (img) {
          img.addEventListener('load', function () {
            console.log(`Image ${id} loaded successfully`);
          });
          img.addEventListener('error', function () {
            console.error(`Failed to load image ${id}`);
          });
        }
      });
    });

    // Mouse wheel scaling component (desktop)
    AFRAME.registerComponent('wheel-scale', {
      schema: {
        min: { type: 'number', default: 0.2 },
        max: { type: 'number', default: 2.5 },
        step: { type: 'number', default: 0.1 }
      },
      init: function () {
        this.onWheel = this.onWheel.bind(this);
        window.addEventListener('wheel', this.onWheel, { passive: false });
      },
      remove: function () {
        window.removeEventListener('wheel', this.onWheel);
      },
      onWheel: function (e) {
        e.preventDefault();
        const object3D = this.el.object3D;
        const current = object3D.scale.x;
        const delta = e.deltaY > 0 ? -this.data.step : this.data.step;
        const next = Math.min(this.data.max, Math.max(this.data.min, current + delta));
        object3D.scale.set(next, next, next);
      }
    });

    // Pinch-to-scale component (mobile)
    AFRAME.registerComponent('pinch-scale', {
      schema: { min: { type: 'number', default: 0.2 }, max: { type: 'number', default: 2.5 } },
      init: function () {
        this.isPinching = false;
        this.startDistance = 0;
        this.startScale = 1;
        this.onTouchStart = this.onTouchStart.bind(this);
        this.onTouchMove = this.onTouchMove.bind(this);
        this.onTouchEnd = this.onTouchEnd.bind(this);
        window.addEventListener('touchstart', this.onTouchStart, { passive: false });
        window.addEventListener('touchmove', this.onTouchMove, { passive: false });
        window.addEventListener('touchend', this.onTouchEnd, { passive: false });
        window.addEventListener('touchcancel', this.onTouchEnd, { passive: false });
      },
      remove: function () {
        window.removeEventListener('touchstart', this.onTouchStart);
        window.removeEventListener('touchmove', this.onTouchMove);
        window.removeEventListener('touchend', this.onTouchEnd);
        window.removeEventListener('touchcancel', this.onTouchEnd);
      },
      getDistance: function (touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      },
      onTouchStart: function (e) {
        if (!this.el.object3D.visible) return;
        if (e.touches && e.touches.length === 2) {
          e.preventDefault();
          this.isPinching = true;
          this.startDistance = this.getDistance(e.touches);
          this.startScale = this.el.object3D.scale.x;
        }
      },
      onTouchMove: function (e) {
        if (!this.isPinching || !this.el.object3D.visible) return;
        if (e.touches && e.touches.length === 2) {
          e.preventDefault();
          const newDist = this.getDistance(e.touches);
          if (this.startDistance <= 0) return;
          const factor = newDist / this.startDistance;
          let next = this.startScale * factor;
          next = Math.min(this.data.max, Math.max(this.data.min, next));
          this.el.object3D.scale.set(next, next, next);
        }
      },
      onTouchEnd: function (e) {
        if (!e.touches || e.touches.length < 2) {
          this.isPinching = false;
        }
      }
    });
  </script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

      </a-entity>
      <a-image src="#chair" width="1.0" height="1.21" position="0.45 -0.8 0.01" rotation="0 0 0"></a-image>
    </a-entity>
